<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>intersched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One-screen pass-the-phone app: a week grid dominates, the pass button sits at thumb height. */
:root {
  --bg: #eef0f6;
  --surface: #ffffff;
  --ink: #171a2b;
  --muted: #5d6280;
  --line: #d5d8e6;
  --accent: #c2410c;
  --accent-ink: #ffffff;
  --gone: #e3e5ee;
  --yes: #15803d;
  --yes-soft: #dcf2e3;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141f; --surface: #1c1f2e; --ink: #eceef7; --muted: #9aa0bf; --line: #2e3247;
    --accent: #f97316; --accent-ink: #1a0d04; --gone: #161825; --yes: #4ade80; --yes-soft: #163222; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141f; --surface: #1c1f2e; --ink: #eceef7; --muted: #9aa0bf; --line: #2e3247;
  --accent: #f97316; --accent-ink: #1a0d04; --gone: #161825; --yes: #4ade80; --yes-soft: #163222; color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
}
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-inline: 16px; padding-block: 20px 28px;
  display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); letter-spacing: 0; text-align: right; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; min-width: 0;
}
.label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row .num { width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.icon-btn { background: transparent; color: var(--muted); width: 40px; height: 40px; flex: none; font-size: 22px; line-height: 1; }
.icon-btn:hover { color: var(--accent); }
.ghost { background: transparent; color: var(--accent); font-weight: 700; padding: 8px 0; align-self: flex-start; }
.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 18px 16px; font-size: 18px; width: 100%; }
.hint { font-size: 14px; color: var(--muted); }
.error { font-size: 14px; color: var(--accent); min-height: 1.2em; }

/* turn */
.who { font-family: var(--font-display); font-weight: 800; font-size: clamp(38px, 12vw, 58px); line-height: 1; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.who-sub { color: var(--muted); margin-top: 6px; }
.week { display: grid; gap: 6px; }
.week .head { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: 0.06em; overflow-wrap: anywhere; }
.week .day { font-variant-numeric: tabular-nums; font-weight: 700; align-self: center; line-height: 1.15; }
.week .day span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.week .day.weekend { color: var(--accent); }
.cell {
  min-height: 48px; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
  font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 4px; min-width: 0;
}
.cell.mine { background: transparent; border: 1.5px dashed var(--accent); color: var(--accent); font-weight: 700; }
.cell.gone { background: var(--gone); border-color: transparent; color: var(--muted); cursor: default; font-size: 13px; }
.cell.gone:focus-visible { outline: none; }
.count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.table { display: flex; flex-wrap: wrap; gap: 6px; }
.seat { font-size: 14px; padding: 4px 10px; border-radius: 999px; border: 1.5px dashed var(--line); color: var(--muted); }
.seat.ok { border-style: solid; border-color: var(--yes); background: var(--yes-soft); color: var(--ink); }
.seat.ok::before { content: "✓ "; color: var(--yes); font-weight: 700; }
.seat.now { border-style: solid; border-color: var(--accent); color: var(--ink); font-weight: 700; }
.foot { display: flex; justify-content: space-between; align-items: center; }
.foot button { background: transparent; color: var(--muted); padding: 8px 0; font-size: 15px; }
.foot button:disabled { opacity: 0.35; cursor: default; }
.notice { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 15px; }

/* done */
.done-head { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 9vw, 42px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); padding: 14px 16px; text-align: left; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.option .d { font-weight: 700; }
.option .p { color: var(--muted); }
.option.sel { border-color: var(--yes); background: var(--yes-soft); }
.option.sel .p { color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 10px; }

@media (prefers-reduced-motion: no-preference) {
  .enter { animation: enter 220ms ease-out; }
  @keyframes enter { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(() => {
  const KEY = "intersched.v2";
  const V = 2;
  const valid = (x) => x && x.v === V && x.screen ? x : null;
  const load = () => { try { return valid(JSON.parse(localStorage.getItem(KEY))); } catch { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function parseIso(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return d; };
  const tomorrow = () => iso(addDays(iso(new Date()), 1));

  const fresh = (prev) => ({
    v: V,
    screen: "setup",
    players: prev?.players?.length ? prev.players : ["", "", ""],
    slots: prev?.slots?.length ? prev.slots : ["Afternoon", "Evening"],
    start: tomorrow(),
    game: null,
  });

  let S = load() || fresh();
  if (S.screen === "setup" && !(S.start >= iso(new Date()))) S.start = tomorrow();

  const fmtDay = (d) => d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const fmtRange = (s) => {
    const a = parseIso(s), b = addDays(s, 6);
    const o = { day: "numeric", month: "short" };
    return `${a.toLocaleDateString("en-GB", o)} – ${b.toLocaleDateString("en-GB", o)}`;
  };

  const app = document.getElementById("app");
  const h = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  function render() {
    try {
      ({ setup: renderSetup, turn: renderTurn, done: renderDone })[S.screen]();
    } catch (e) {
      console.error(e);
      S = fresh(S && S.v === V ? S : null);
      renderSetup();
    }
    save();
  }

  // ---------- setup ----------
  function renderSetup() {
    const listRows = (key, ph) => S[key].map((v, i) => `
      <div class="row">
        <span class="num">${i + 1}</span>
        <input id="${key}-${i}" data-key="${key}" data-i="${i}" value="${h(v)}" placeholder="${ph}" autocomplete="off">
        <button class="icon-btn" data-del="${key}" data-i="${i}" aria-label="Remove">×</button>
      </div>`).join("");
    const startLabel = () => `Start with ${S.players.find((p) => p.trim()) || "player 1"}`;
    app.innerHTML = `
      <div class="brand">intersched</div>
      <fieldset>
        <span class="label">Players, in seat order</span>
        ${listRows("players", "Name")}
        <button class="ghost" data-add="players">+ Add player</button>
      </fieldset>
      <fieldset>
        <span class="label">Time slots, earliest first</span>
        ${listRows("slots", "e.g. Evening")}
        <button class="ghost" data-add="slots">+ Add slot</button>
      </fieldset>
      <fieldset>
        <label class="label" for="start">First day</label>
        <input id="start" type="date" value="${S.start}" min="${iso(new Date())}">
      </fieldset>
      <div class="error" id="err"></div>
      <button class="primary" id="go">${h(startLabel())}</button>`;

    app.querySelectorAll("input[data-key]").forEach((el) => el.addEventListener("input", () => {
      S[el.dataset.key][+el.dataset.i] = el.value; save();
      if (el.dataset.key === "players") document.getElementById("go").textContent = startLabel();
    }));
    app.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => {
      const k = b.dataset.add; S[k].push(""); render();
      document.getElementById(`${k}-${S[k].length - 1}`).focus();
    });
    app.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
      const k = b.dataset.del; if (S[k].length > 1) S[k].splice(+b.dataset.i, 1); else S[k][0] = ""; render();
    });
    document.getElementById("start").onchange = (e) => { S.start = e.target.value; save(); };
    document.getElementById("go").onclick = () => {
      const players = S.players.map((p) => p.trim()).filter(Boolean);
      const slots = S.slots.map((p) => p.trim()).filter(Boolean);
      const err = document.getElementById("err");
      if (players.length < 2) return err.textContent = "Add at least two players.";
      if (!slots.length) return err.textContent = "Add at least one time slot.";
      if (!S.start) return err.textContent = "Pick a first day.";
      S.players = players; S.slots = slots;
      // struck maps a cell index (day * nSlots + slot) to the player who ruled it out.
      S.game = { players, slots, week: S.start, turn: 0, done: [], struck: {}, skipped: 0, history: [] };
      S.screen = "turn"; render();
    };
  }

  // ---------- turn ----------
  const cells = (g) => 7 * g.slots.length;
  const openCount = (g) => cells(g) - Object.keys(g.struck).length;

  function pass() {
    const g = S.game;
    const { history, ...rest } = g;
    history.push(JSON.stringify(rest));
    g.done.push(g.turn);
    const next = (g.turn + 1) % g.players.length;
    if (openCount(g) === 0) {
      g.week = iso(addDays(g.week, 7)); g.struck = {}; g.done = []; g.skipped++; g.turn = next;
      g.rolled = true;
    } else if (g.done.length === g.players.length) {
      S.screen = "done"; g.sel = null;
    } else {
      g.turn = next; g.rolled = false;
    }
    render(); window.scrollTo(0, 0);
  }

  function undo() {
    const g = S.game; const prev = g.history.pop(); if (!prev) return;
    Object.assign(g, JSON.parse(prev)); S.screen = "turn"; render();
  }

  function renderTurn() {
    const g = S.game, n = g.slots.length, me = g.turn;
    const nextName = g.players[(me + 1) % g.players.length];
    const isLast = g.done.length === g.players.length - 1;
    const open = openCount(g);

    let grid = `<div></div>` + g.slots.map((s) => `<div class="head">${h(s)}</div>`).join("");
    for (let day = 0; day < 7; day++) {
      const d = addDays(g.week, day), wk = d.getDay() === 0 || d.getDay() === 6;
      grid += `<div class="day ${wk ? "weekend" : ""}">${d.toLocaleDateString("en-GB", { weekday: "short" })}<span>${d.toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span></div>`;
      for (let s = 0; s < n; s++) {
        const idx = day * n + s, by = g.struck[idx];
        if (by === undefined) grid += `<button class="cell" data-idx="${idx}" aria-label="Rule out ${h(g.slots[s])}">&nbsp;</button>`;
        else if (by === me) grid += `<button class="cell mine" data-idx="${idx}" aria-label="Put back">✕</button>`;
        else grid += `<button class="cell gone" tabindex="-1" aria-disabled="true">${h(g.players[by].slice(0, 1))}</button>`;
      }
    }
    const seats = g.players.map((p, i) => `<span class="seat ${g.done.includes(i) ? "ok" : i === me ? "now" : ""}">${h(p)}</span>`).join("");
    const btn = open === 0 ? `Nothing left · next week` : isLast ? `Done` : `Pass to ${nextName}`;

    app.innerHTML = `
      <div class="brand">intersched <small>${fmtRange(g.week)}</small></div>
      ${g.rolled ? `<div class="notice">Nothing worked last week. Same again for ${fmtRange(g.week)}.</div>` : ""}
      <div class="enter">
        <div class="who">${h(g.players[me])}</div>
        <div class="who-sub">Tap every slot you can't make.</div>
      </div>
      <div class="week" style="grid-template-columns: 4.2em repeat(${n}, minmax(0, 1fr))">${grid}</div>
      <div class="count"><b>${open}</b> of ${cells(g)} slots still open</div>
      <div class="table">${seats}</div>
      <button class="primary" id="pass">${h(btn)}</button>
      <div class="foot">
        <button id="undo" ${g.history.length ? "" : "disabled"}>↶ Back to ${h(g.players[(me - 1 + g.players.length) % g.players.length])}</button>
        <button id="reset">Start over</button>
      </div>`;

    app.querySelectorAll("[data-idx]").forEach((b) => b.onclick = () => {
      const idx = b.dataset.idx;
      if (g.struck[idx] === me) delete g.struck[idx]; else g.struck[idx] = me;
      render();
    });
    document.getElementById("pass").onclick = pass;
    document.getElementById("undo").onclick = undo;
    bindReset();
  }

  function bindReset() {
    const b = document.getElementById("reset");
    b.onclick = () => {
      if (b.dataset.armed) { S = fresh(S); render(); return; }
      b.dataset.armed = "1"; b.textContent = "Tap again to start over"; b.style.color = "var(--accent)";
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Start over"; b.style.color = ""; } }, 3000);
    };
  }

  // ---------- done ----------
  function renderDone() {
    const g = S.game, n = g.slots.length;
    const open = [];
    for (let idx = 0; idx < cells(g); idx++) if (g.struck[idx] === undefined) open.push(idx);
    if (g.sel == null || !open.includes(g.sel)) g.sel = open[0];
    const label = (idx) => ({ d: fmtDay(addDays(g.week, Math.floor(idx / n))), p: g.slots[idx % n] });
    const opts = open.map((idx) => { const l = label(idx); return `<button class="option ${idx === g.sel ? "sel" : ""}" data-idx="${idx}"><span class="d">${l.d}</span><span class="p">${h(l.p)}</span></button>`; }).join("");

    app.innerHTML = `
      <div class="brand">intersched <small>${g.skipped ? `${g.skipped} week${g.skipped > 1 ? "s" : ""} skipped` : fmtRange(g.week)}</small></div>
      <div class="done-head enter">${open.length === 1 ? "One slot works for everyone" : `${open.length} slots work for everyone`}</div>
      <div class="options">${opts}</div>
      <div class="stack">
        <button class="primary" id="copy">Copy ${h(label(g.sel).d.split(" ")[0])} ${h(label(g.sel).p.toLowerCase())}</button>
        <div class="foot">
          <button id="undo">↶ Back to ${h(g.players[g.turn])}</button>
          <button id="reset">Start over</button>
        </div>
      </div>`;

    app.querySelectorAll("[data-idx]").forEach((b) => b.onclick = () => { g.sel = +b.dataset.idx; render(); });
    const copy = document.getElementById("copy");
    copy.onclick = () => {
      const l = label(g.sel), text = `${l.d}, ${l.p.toLowerCase()}`;
      const ok = () => { copy.textContent = "Copied"; };
      try { navigator.clipboard.writeText(text).then(ok, () => { copy.textContent = text; }); } catch { copy.textContent = text; }
    };
    document.getElementById("undo").onclick = undo;
    bindReset();
  }

  render();
})();
</script>
</body>
</html>
